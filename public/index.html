<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asni Penision - Room & Restaurant Booking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="custom.css">
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center">
                    <h1 class="text-xl sm:text-2xl font-bold text-emerald-700">🏨 Asni Penision</h1>
                </div>
                <nav class="hidden sm:flex space-x-6">
                    <a href="#rooms" class="text-gray-600 hover:text-emerald-700 transition">Rooms</a>
                    <a href="#restaurant" class="text-gray-600 hover:text-emerald-700 transition">Restaurant</a>
                    <a href="#bookings" class="text-gray-600 hover:text-emerald-700 transition">My Bookings</a>
                </nav>
            </div>
        </div>
    </header>

    <!-- Hero -->
    <section class="bg-gradient-to-r from-emerald-600 to-teal-500 text-white py-12 sm:py-16">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <h2 class="text-2xl sm:text-4xl font-bold mb-3">Welcome to Asni Penision</h2>
            <p class="text-sm sm:text-lg opacity-90">Book your perfect stay and dining experience</p>
        </div>
    </section>

    <!-- Booking Type Tabs -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 -mt-6">
        <div class="bg-white rounded-lg shadow-lg p-1 flex">
            <button data-tab="room" class="tab-btn flex-1 py-3 text-sm sm:text-base font-medium rounded-md transition bg-emerald-600 text-white">
                🛏️ Room Booking
            </button>
            <button data-tab="restaurant" class="tab-btn flex-1 py-3 text-sm sm:text-base font-medium rounded-md transition text-gray-600 hover:bg-gray-100">
                🍽️ Restaurant
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Room Booking Form -->
        <div id="room-form" class="form-section">
            <div class="bg-white rounded-lg shadow-md p-5 sm:p-8">
                <h3 class="text-xl sm:text-2xl font-bold text-gray-800 mb-6">Book a Room</h3>
                <form id="booking-form" class="space-y-5">
                    <input type="hidden" id="booking-type" value="room">
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Full Name *</label>
                            <input type="text" id="guest-name" required
                                class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent outline-none transition text-sm">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Email *</label>
                            <input type="email" id="guest-email" required
                                class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent outline-none transition text-sm">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Phone *</label>
                            <input type="tel" id="guest-phone" required
                                class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent outline-none transition text-sm">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Room Type *</label>
                            <select id="room-type" required
                                class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent outline-none transition text-sm bg-white">
                                <option value="">Select room type</option>
                                <option value="single">Single Room - $50/night</option>
                                <option value="double">Double Room - $80/night</option>
                                <option value="suite">Suite - $150/night</option>
                                <option value="family">Family Room - $120/night</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-5">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Check-in *</label>
                            <input type="date" id="check-in" required
                                class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent outline-none transition text-sm">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Check-out *</label>
                            <input type="date" id="check-out" required
                                class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent outline-none transition text-sm">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Guests *</label>
                            <input type="number" id="num-guests" min="1" max="10" value="1" required
                                class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent outline-none transition text-sm">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Special Requests</label>
                        <textarea id="special-requests" rows="3"
                            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent outline-none transition text-sm resize-none"></textarea>
                    </div>

                    <button type="submit"
                        class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 px-6 rounded-lg transition shadow-md hover:shadow-lg text-sm sm:text-base">
                        Book Room
                    </button>
                </form>
            </div>
        </div>

        <!-- Restaurant Booking Form -->
        <div id="restaurant-form" class="form-section hidden">
            <div class="bg-white rounded-lg shadow-md p-5 sm:p-8">
                <h3 class="text-xl sm:text-2xl font-bold text-gray-800 mb-6">Reserve a Table</h3>
                <form id="restaurant-booking-form" class="space-y-5">
                    <input type="hidden" id="booking-type-rest" value="restaurant">
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Full Name *</label>
                            <input type="text" id="rest-name" required
                                class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent outline-none transition text-sm">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Email *</label>
                            <input type="email" id="rest-email" required
                                class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent outline-none transition text-sm">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-5">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Phone *</label>
                            <input type="tel" id="rest-phone" required
                                class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent outline-none transition text-sm">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Date *</label>
                            <input type="date" id="rest-date" required
                                class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent outline-none transition text-sm">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Time *</label>
                            <input type="time" id="rest-time" required
                                class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent outline-none transition text-sm">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Number of Guests *</label>
                            <input type="number" id="rest-guests" min="1" max="20" value="2" required
                                class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent outline-none transition text-sm">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Table Preference</label>
                            <select id="table-pref"
                                class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent outline-none transition text-sm bg-white">
                                <option value="any">Any</option>
                                <option value="window">Window</option>
                                <option value="outdoor">Outdoor</option>
                                <option value="private">Private</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Special Requests</label>
                        <textarea id="rest-requests" rows="3"
                            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent outline-none transition text-sm resize-none"></textarea>
                    </div>

                    <button type="submit"
                        class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 px-6 rounded-lg transition shadow-md hover:shadow-lg text-sm sm:text-base">
                        Reserve Table
                    </button>
                </form>
            </div>
        </div>

        <!-- My Bookings Section -->
        <section id="bookings" class="mt-12">
            <h3 class="text-xl sm:text-2xl font-bold text-gray-800 mb-6">My Bookings</h3>
            <div class="flex gap-3 mb-4">
                <input type="email" id="lookup-email" placeholder="Enter your email to view bookings"
                    class="flex-1 px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent outline-none transition text-sm">
                <button id="lookup-btn"
                    class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 px-5 rounded-lg transition text-sm whitespace-nowrap">
                    Search
                </button>
            </div>
            <div id="bookings-list" class="space-y-3"></div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t mt-12 py-6">
        <div class="max-w-7xl mx-auto px-4 text-center text-sm text-gray-500">
            © 2025 Asni Penision. All rights reserved.
        </div>
    </footer>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-4 left-4 right-4 sm:left-auto sm:right-4 sm:w-96 transform translate-y-20 opacity-0 transition-all duration-300 z-50">
        <div id="toast-content" class="rounded-lg shadow-lg p-4 text-white text-sm"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
